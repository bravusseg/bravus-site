name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: npm run build
      - name: Run Accessibility Tests
        run: npm run test:accessibility
      - name: Run Performance Tests
        run: npm run test:performance
      - name: Lint Code
        run: npm run lint
